{% extends "base.html" %}{% block title %}Student registration{% endblock %}
{% block content %}<section class="form-card"><div class="eyebrow">STUDENT PORTAL</div><h1>Create your account</h1><form method="post">
<label>Full name<input name="name" maxlength="120" required></label><label>Email address<input type="email" name="email" required></label><label>Mobile number<input name="phone" maxlength="30"></label><label>Password <small>(minimum 8 characters)</small><input type="password" name="password" minlength="8" required></label><button class="button primary full">Create student account</button></form><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
